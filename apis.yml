name: Tello
description: Tello (Tello Applications, Inc.) was a customer-feedback and customer-service ratings
  startup founded in 2010 in Palo Alto, California by Joe Beninato and backed by 500 Global. It offered a
  free web and mobile application that let consumers rate and comment on their in-person service experiences
  at businesses (including feedback on specific employees), and sold businesses paid dashboard access to
  monitor how their staff were rated. The company has since shut down; no live product, developer program,
  or public API surface remains, so this record is retained as a defunct-company profile rather than an
  active provider for enrichment.
